{% extends "base.html" %}

{% block title %}Shop | Solvaara{% endblock %}

{% block content %}
<h1>Shop</h1>

{% for product in products %}
<article>
    {% if product.main_image %}
    <img src="{{ product.main_image.url }}" alt="{{ product.main_image_alt }}" width="300">
    {% endif %}
    <h2><a href="{{ product.get_absolute_url }}">{{ product.name }}</a></h2>
    <p>{{ product.category.name }}</p>
</article>
{% empty %}
<p>No products yet.</p>
{% endfor %}
{% endblock %}
