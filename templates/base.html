<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Solvaara{% endblock %}</title>
</head>

<body>
    <header>
        <a href="{% url 'home' %}">Solvaara</a>
        <nav>
            <a href="{% url 'product_list' %}">All jewellery</a>
            {% for category in nav_categories %}
            <a href="{% url 'product_list' %}?category={{ category.slug }}">{{ category.name }}</a>
            {% endfor %}
        </nav>
    </header>
    {% block content %}{% endblock %}
</body>

</html>
